version: "3.9"

services:

  # ============================================================
  #  1. pgVector — Base de datos RAG / Búsqueda semántica
  # ============================================================
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: rag_legal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGVECTOR_USER:-rag_user}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-rag_password}
      POSTGRES_DB: ${PGVECTOR_DB:-rag_legal}
    ports:
      - "${PGVECTOR_PORT:-5434}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-rag_user} -d ${PGVECTOR_DB:-rag_legal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  #  2. PostgreSQL estándar — Sistema de usuarios / laboral
  # ============================================================
  postgres_laboral:
    image: postgres:16-alpine
    container_name: laboral_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LABORAL_USER:-laboral_user}
      POSTGRES_PASSWORD: ${LABORAL_PASSWORD:-laboral_password}
      POSTGRES_DB: ${LABORAL_DB:-sistema_laboral}
    ports:
      - "5433:5432"
    volumes:
      - postgres_laboral_data:/var/lib/postgresql/data
      - ./sql/init_laboral.sql:/docker-entrypoint-initdb.d/01_init_laboral.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LABORAL_USER:-laboral_user} -d ${LABORAL_DB:-sistema_laboral}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  #  3. pgAdmin — Administración visual de AMBAS bases de datos
  # ============================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_ui
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@legal.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      pgvector:
        condition: service_healthy
      postgres_laboral:
        condition: service_healthy

volumes:
  pgvector_data:
    driver: local
  postgres_laboral_data:
    driver: local
  pgadmin_data:
    driver: local
